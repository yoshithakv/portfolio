<style>
/* Layout: bare-bones document. One 680px text column, no cards, no fills; rules and type do the structure. Green only for links and figures.
   Type scale (5 roles, used everywhere):
   lead   IBM Plex Sans 18/1.6 400 fg      intro sentences
   title  IBM Plex Sans 16/1.4 600 fg      item names: roles, projects, skill groups
   body   IBM Plex Sans 15/1.6 400 fg-2    descriptions
   label  IBM Plex Sans 12 uppercase section headers (always with a rule underneath)
   meta   IBM Plex Sans 13 fg-3       dates, years, keywords */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --fg-2: #5f6360;
  --fg-3: #8d918e;
  --rule: #e7e8e7;
  --accent: #1c5b48;
  --ph: #f2f3f2;
  --need: #a15c00;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Mynerve", "Bradley Hand", cursive;
}
/* THEMES (disabled for now). To bring them back: uncomment this block, the switcher button in the header and the theme script at the bottom,
   and add the Fuzzy Bubbles font (Blackboard) back to the Google Fonts link.
// Blackboard: chalk on a dark slate. Handwritten (Fuzzy Bubbles) for everything; it runs wide, so sizes are trimmed. 
:root[data-theme="blackboard"] { --bg: #222222; --fg: #f1f1ec; --fg-2: #cfcfc8; --fg-3: #9a9a94; --rule: #5a5a56; --accent: #9fe3b9; --ph: #2b2b2b; --need: #f0d27a; color-scheme: dark; --sans: "Fuzzy Bubbles", "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Fuzzy Bubbles"; }
:root[data-theme="blackboard"] .lead { font-size: 19px; line-height: 1.55; }
:root[data-theme="blackboard"] .title, :root[data-theme="blackboard"] .name, :root[data-theme="blackboard"] .blk-p, :root[data-theme="blackboard"] .cs-sec > p { font-size: 15px; }
:root[data-theme="blackboard"] .body, :root[data-theme="blackboard"] nav, :root[data-theme="blackboard"] .flow { font-size: 14px; }
:root[data-theme="blackboard"] .meta, :root[data-theme="blackboard"] .theme { font-size: 12px; }
:root[data-theme="blackboard"] .sh h2 { font-size: 12px; letter-spacing: 0.08em; }
:root[data-theme="blackboard"] .sh { border-bottom-style: dashed; }
:root[data-theme="blackboard"] .mark { filter: invert(1); }
:root[data-theme="blackboard"] .logo { filter: grayscale(1); }
// Tubelight: Paper, lit by one red tube from the top left. Everything else falls into shadow; text stays white. 
:root[data-theme="tubelight"] { --bg: #0b0505; --fg: #fff1ee; --fg-2: #ecc9c2; --fg-3: #d9aca4; --rule: rgba(255, 220, 214, 0.2); --accent: #ffd2ca; --ph: rgba(255, 255, 255, 0.05); --need: #ffd27a; color-scheme: dark; }
:root[data-theme="tubelight"] body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(ellipse 14% 10% at 0% 0%, rgba(255, 90, 70, 0.8), transparent 100%),
              radial-gradient(ellipse 100% 75% at 0% 0%, rgba(255, 30, 18, 0.7), rgba(255, 30, 18, 0.3) 45%, transparent 80%),
              radial-gradient(ellipse 160% 120% at 0% 0%, rgba(255, 30, 18, 0.14), transparent 85%); }
:root[data-theme="tubelight"] .mark { filter: invert(1); }
:root[data-theme="tubelight"] .photo .frame { background: #e8402f; }
:root[data-theme="tubelight"] .photo img { filter: grayscale(1) contrast(1.4) brightness(.95); mix-blend-mode: multiply; }
:root[data-theme="tubelight"] .logo { filter: grayscale(1) sepia(1) saturate(6) hue-rotate(-52deg) brightness(.9); }
:root[data-theme="tubelight"] ::selection { background: #ff5a47; color: #0b0505; }
.theme { font: 13px var(--sans); color: var(--fg-3); background: none; border: 0; padding: 8px 0; min-height: 36px; cursor: pointer; text-align: right; }
.theme:hover { color: var(--accent); }
*/

* { box-sizing: border-box; border-radius: 0 !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
p, ul { margin: 0; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
/* Hover: links fill with the accent so the change is unmistakable. Tiles and the name have their own hover. */
@media (hover: hover) {
  a:not(.tile):hover { background: var(--accent); color: var(--bg); text-decoration-color: transparent; }
  .tile:hover { background: none; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 13px; height: 13px; display: inline-block; vertical-align: -1px; margin-left: 3px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: square; }
.ico.lead { margin: 0 6px 0 0; width: 15px; height: 15px; vertical-align: -2px; }

/* Type roles */
.lead { font-size: 18px; line-height: 1.6; color: var(--fg); }
.title { font-size: 16px; line-height: 1.4; font-weight: 600; color: var(--fg); }
.body { font-size: 15px; line-height: 1.6; color: var(--fg-2); }
.meta { font: 13px/1.5 var(--sans); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.need { font: 12px var(--sans); color: var(--need); }

.wrap { overflow-x: clip; max-width: 680px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
header .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 32px 0; flex-wrap: wrap; }
.name { color: var(--fg); text-decoration: none; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; }
.mark { height: 22px; width: auto; display: block; }
nav { align-items: center; }
@media (hover: hover) { .name:hover { background: var(--accent); color: var(--bg); } .name:hover .mark { filter: invert(1); } }
nav { display: flex; gap: 20px; font-size: 15px; }
nav a { color: var(--fg-2); text-decoration: none; }
nav a:hover { color: var(--fg); }
nav a[aria-current="page"] { color: var(--fg); text-decoration: underline; text-decoration-color: var(--accent); }

main { padding-block: 72px 96px; }
.view { display: grid; gap: 72px; }
section { display: grid; gap: 20px; }

/* Section header: label + rule underneath, optional action on the right. One component everywhere. */
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
.sh h2 { font: 600 12px/1.4 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); }
.sh h2 .n { color: var(--accent); margin-right: 10px; }
.sh a { font-size: 14px; white-space: nowrap; }

.intro { display: grid; gap: 14px; }

/* Home: 2 × 2 work grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px 24px; }
.tile { display: grid; gap: 10px; text-decoration: none; align-content: start; }
.tile .thumb { aspect-ratio: 4 / 3; background: var(--ph); max-width: 100%; transition: outline-color .15s; outline: 2px solid transparent; outline-offset: -1px; }
@media (hover: hover) { .tile:hover .thumb { outline-color: var(--accent); } }
.tile .top .meta { white-space: nowrap; }
.tile .title { font-weight: 400; }
.tile .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
@media (hover: hover) { .tile:hover .title { color: var(--accent); } }

/* Work list */
.list { list-style: none; padding: 0; }
.list li { border-bottom: 1px solid var(--rule); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; padding-block: 16px; text-decoration: none; }
.item:hover .title { color: var(--accent); }
.item .body { grid-column: 1 / -1; }
.item .kw { grid-column: 1 / -1; }

/* Rows: left column is meta (dates) or a title (skill group); right column is title + body */
.rows { display: grid; }
.r { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 24px; padding-block: 16px; border-bottom: 1px solid var(--rule); }
.rows .r:first-child { padding-top: 4px; }
.r .meta, .r > .title { padding-top: 1px; }
.r .role { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { width: 56px; height: 40px; object-fit: contain; object-position: left center; flex: none; display: block; }
.logo.jpg { background: #fff; width: 40px; }
.logo.fyno { width: 50px; height: 36px; }
.logo.mono { display: grid; place-items: center; width: 40px; background: var(--accent); color: var(--bg); font: 600 16px var(--sans); }
.r ul { padding-left: 18px; margin-top: 6px; display: grid; gap: 2px; }
.r .body + .body { margin-top: 2px; }

/* Experience: logo | name, duration under the name */
.xs { display: grid; }
.x { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 110px; gap: 4px 20px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--rule); }
.x:first-child { padding-top: 4px; }
.x .title { font-weight: 400; }
.x .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.x .logo { width: 30px; height: 30px; object-fit: contain; object-position: center; }
.x .logo.jpg { width: 30px; }
.x .logo.fyno { padding: 3px; }
.x .who .logo { flex: none; }
.x .logo.mono { width: 30px; font-size: 14px; }
.x .role { color: var(--fg-2); font-size: 15px; text-align: left; justify-self: start; }
.x .meta { justify-self: end; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 20px; }
.person { display: grid; gap: 2px; align-content: start; }
.person .title { font-weight: 400; }
.person .role { font-size: 14px; color: var(--fg-2); }

.x.nl { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }

/* About: passport-size portrait, swaps on hover */
.hero { display: grid; gap: 32px; align-content: start; padding-top: 24px; justify-items: start; padding-bottom: clamp(40px, 10vh, 120px); }
.hero .intro { max-width: 600px; }
.photo { position: relative; width: 192px; max-width: 100%; aspect-ratio: 7 / 9; background: var(--ph); cursor: default; }
.photo .frame { position: absolute; inset: 0; overflow: hidden; }
.photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .25s; }
.photo img.a { object-position: 50% 15%; }
.photo img.b { opacity: 0; object-position: 50% 20%; transform: scale(1.7); transform-origin: 50% 35%; }
/* Tooltips look like masking tape with handwriting on it */
.tape { position: absolute; z-index: 8; pointer-events: none; opacity: 0; transition: opacity .15s; width: max-content; max-width: min(240px, 72vw); padding: 5px 16px 7px; background: #e8d7a7; color: #2a2823; font: 400 16px/1.25 var(--hand); text-align: left; text-decoration: none; white-space: normal; transform: rotate(-1.8deg);
  clip-path: polygon(0 0, 3% 12%, 0 25%, 3% 38%, 0 50%, 3% 62%, 0 75%, 3% 88%, 0 100%, 100% 100%, 97% 88%, 100% 75%, 97% 62%, 100% 50%, 97% 38%, 100% 25%, 97% 12%, 100% 0); }
.tipper, .hv { position: relative; }
.hv { cursor: default; text-decoration: underline dotted var(--fg-3); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.tipper:focus-visible > .tape, .hv:focus-visible > .tape, .hv.open > .tape { opacity: 1; }
@media (hover: hover) { .tipper:hover > .tape, .hv:hover > .tape { opacity: 1; } }
.tipper > .tape { bottom: calc(100% + 6px); left: 0; }
.hv > .tape { bottom: calc(100% + 4px); left: 0; }
.photo > .tape { top: 24px; left: calc(100% + 16px); }
.photo:focus-visible img.b, .photo.flip img.b { opacity: 1; }
.photo:focus-visible img.a, .photo.flip img.a { opacity: 0; }
.photo:focus-visible .tape, .photo.flip .tape { opacity: 1; }
@media (hover: hover) {
  .photo:hover img.b { opacity: 1; }
  .photo:hover img.a { opacity: 0; }
  .photo:hover .tape { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .photo img, .tape { transition: none; } }

/* Case study blocks */
.blocks { display: grid; gap: 20px; }
.blk-sec { margin-top: 36px; }
.blk-p { max-width: 64ch; color: var(--fg); font-size: 15px; }
.lab { font-weight: 600; }
.imgs { display: grid; gap: 20px; }
.imgs.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.imgs.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stats.s2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats.s4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* About: health stats */

/* Contact */
.contact-lines { display: grid; gap: 8px; }
.contact-lines .title { font-weight: 400; }
.contact-lines .links { display: flex; flex-wrap: wrap; gap: 4px 20px; }
#addr { user-select: all; }

/* Case study */
.back { font-size: 14px; color: var(--fg-2); text-decoration: none; justify-self: start; }
.back:hover { color: var(--fg); }
.cs-head { display: grid; gap: 12px; }
.blk-sec .sh h2 { font-weight: 400; }
.cs-head h1 { font-weight: 400; font-size: clamp(26px, 4vw, 32px); line-height: 1.2; letter-spacing: -0.01em; }
.dots span + span::before { content: " · "; color: var(--fg-3); }
.live { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; }
figure { margin: 0; display: grid; gap: 8px; }
.ph { background: var(--ph); aspect-ratio: 16 / 9; max-width: 100%; display: grid; place-items: center; padding: 16px; text-align: center; }
.ph.sq { aspect-ratio: 4 / 3; }
figcaption { font-size: 13px; color: var(--fg-3); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-block: 16px; border-block: 1px solid var(--rule); }
.stats .n { font-size: 24px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.2; }
.cs-sec > p { font-size: 15px; color: var(--fg); max-width: 64ch; }
.cs-sec .lab { font-weight: 600; }
.flow { font-size: 15px; color: var(--fg-2); display: grid; gap: 6px; overflow-x: auto; }
.flow .hl { color: var(--accent); font-weight: 600; }
.flow .bad { text-decoration: line-through; color: var(--fg-3); }
.flow .meta { margin-right: 8px; }
pre { margin: 0; padding: 14px 0; border-block: 1px solid var(--rule); overflow-x: auto; font: 13px/1.6 var(--sans); color: var(--fg); }
pre .c { color: var(--fg-3); }
.screens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.results { padding-left: 18px; display: grid; gap: 6px; }
.results strong { color: var(--accent); font-weight: 600; }

footer .wrap { padding-block: 24px 40px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 12px; font-size: 13px; z-index: 30; }

/* Breakpoints: 720 (tablet, tighter rhythm) · 560 (phone: one column, stacked rows) · 380 (small phone: tighter gutters and type) */
@media (max-width: 720px) {
  main { padding-block: 56px 80px; }
  .view { gap: 60px; }
  .grid { gap: 32px 20px; }
}
@media (max-width: 560px) {
  header .wrap { padding-block: 20px 0; }
  main { padding-block: 40px 64px; }
  .view { gap: 52px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .r { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .stats, .stats.s2, .stats.s4 { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .screens, .imgs.c2 { grid-template-columns: minmax(0, 1fr); }
  .imgs.c3 { gap: 10px; }
    .hero { gap: 24px; padding-top: 8px; padding-bottom: 40px; }
  .photo > .tape { top: auto; bottom: 20px; left: calc(100% + 12px); max-width: max(110px, calc(100vw - 216px)); }
  .photo { width: 148px; }
  .x { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; align-items: baseline; }
  .x .who { grid-column: 1 / -1; align-items: center; }
  .x .role { grid-column: 1; grid-row: 2; padding-left: 42px; }
  .x.nl { grid-template-columns: minmax(0, 1fr); }
  .x.nl .role { grid-column: 1; padding-left: 0; }
  .x .meta { grid-column: 2; grid-row: 2; justify-self: end; text-align: right; white-space: nowrap; }
  .lead { font-size: 17px; }
  .sh { flex-wrap: wrap; }
}
@media (max-width: 380px) {
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .name { font-size: 15px; }
  .cs-head h1 { font-size: 24px; }
  .imgs.c3 { gap: 6px; }
  footer .wrap { flex-direction: column; }
}
</style>
</head>

/* Case study blocks. A case study renders from a list of blocks: blocksFor(c) builds the default list
   from the fields above; give a case study its own `blocks: [...]` to replace it entirely.
   The header (title, tagline, role/timeline/team, live links) and "Next case study" stay fixed.
   Block types:
   { t: "sec", title, plain? }              section header, numbered 01, 02… (plain: true = no number)
   { t: "text", lab?, text }                paragraph, optional bold lead-in
   { t: "list", items: [html] }             bullets
   { t: "img", note, ratio?, cap? }         one image; ratio "16/9" (default), "4/3", "3/4", "1/1", "21/9"
   { t: "imgs", cols: 2|3, ratio?, items: [{ note, cap }] }
   { t: "stats", items: [{ num, lbl }] }    2, 3 or 4 numbers
   { t: "flow", rows: [{ label, steps, hl?, bad? }] }
   { t: "code", code, cap? }
   { t: "results", items: [{ m, t }] }
   { t: "need", text }                      marker for something still to add */
function blocksFor(c) {
  return [
    { t: "img", note: c.heroNote },
    { t: "stats", items: c.stats },
    { t: "sec", title: "Context & challenge" },
    { t: "text", lab: "Problem.", text: c.challenge.problem },
    { t: "text", lab: "Goal.", text: c.challenge.goal },
    { t: "sec", title: "System & workflow" },
    { t: "text", text: c.system.intro },
    { t: "flow", rows: c.system.flow },
    { t: "text", lab: "Key move.", text: c.system.innovation },
    { t: "sec", title: c.build.title },
    { t: "text", text: c.build.focus },
    ...(c.build.code ? [{ t: "code", code: c.build.code, cap: c.build.codeCap }] : []),
    ...(c.build.need ? [{ t: "need", text: c.build.need }] : []),
    { t: "text", lab: "Takeaway.", text: c.build.takeaway },
    { t: "sec", title: "Key screens" },
    { t: "imgs", cols: c.screensCols || 2, ratio: c.screensRatio || "4/3", items: c.screens.map(s => ({ note: "screen", cap: `<span style="color:var(--fg)">${s.t}.</span> ${s.d}` })) },
    { t: "sec", title: "Results & impact" },
    { t: "results", items: c.results }
  ];
}

function flowRow(r) {
  return `<div><span class="meta">${r.label}</span>${r.steps.map((s, i) => {
    const cls = (r.hl || []).includes(i) ? "hl" : (r.bad || []).includes(i) ? "bad" : "";
    return `<span class="${cls}">${s}</span>`;
  }).join(" → ")}</div>`;
}

function renderBlocks(blocks) {
  let n = 0;
  const cap = (x) => x ? `<figcaption>${x}</figcaption>` : "";
  const R = {
    sec: (b) => `<div class="blk-sec">${sh(`${b.plain ? "" : `<span class="n">${String(++n).padStart(2, "0")}</span>`}${b.title}`)}</div>`,
    text: (b) => `<p class="blk-p">${b.lab ? `<span class="lab">${b.lab}</span> ` : ""}${b.text}</p>`,
    list: (b) => `<ul class="results blk-p">${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`,
    img: (b) => !DRAFT ? "" : `<figure><div class="ph" style="aspect-ratio:${b.ratio || "16/9"}">${NEED(b.note)}</div>${cap(b.cap)}</figure>`,
    imgs: (b) => !DRAFT ? "" : `<div class="imgs c${b.cols || 2}">${b.items.map(i => `<figure><div class="ph" style="aspect-ratio:${b.ratio || "4/3"}">${NEED(i.note || "image")}</div>${cap(i.cap)}</figure>`).join("")}</div>`,
    stats: (b) => `<div class="stats s${b.items.length}">${b.items.map(s => `<div><div class="n">${s.num}</div><div class="meta">${s.lbl}</div></div>`).join("")}</div>`,
    flow: (b) => `<div class="flow">${b.rows.map(flowRow).join("")}</div>`,
    code: (b) => `<figure><pre>${b.code}</pre>${cap(b.cap)}</figure>`,
    results: (b) => `<ul class="results">${b.items.filter(r => r.t).map(r => `<li><strong>${r.m}</strong> ${r.t}</li>`).join("")}</ul>`,
    need: (b) => DRAFT ? `<p>${NEED(b.text)}</p>` : ""
  };
  return blocks.map(b => (R[b.t] || (() => ""))(b)).join("");
}

function viewCase(c) {
  const i = CASES.indexOf(c);
  const next = CASES[(i + 1) % CASES.length];
  return `<div class="view" style="gap:56px">
    <a class="back" href="#work">← Work</a>
    <section class="cs-head">
      <h1>${c.title}</h1>
      <p class="lead" style="color:var(--fg-2)">${c.tagline}</p>
      <p class="meta dots"><span>${c.role}</span><span>${c.timeline}</span><span>${c.team}</span></p>
      ${c.live.length ? `<div class="live">${c.live.map(([l, u]) => ext(l, u)).join("")}</div>` : ""}
    </section>
    <div class="blocks">${renderBlocks(c.blocks || blocksFor(c))}</div>
    <section>
      ${sh("Next case study")}
      <a class="title" href="#${next.slug}">${next.title} →</a>
    </section>
  </div>`;
}

/* ---------- Router ---------- */
const app = document.getElementById("app");
const SECTIONS = ["work", "about", "experience", "skills", "volunteering", "side-quests", "influence", "contact"];
function render() {
  const key = (location.hash || "#").slice(1);
  const c = CASES.find(x => x.slug === key);
  app.innerHTML = c ? viewCase(c) : viewHome();
  document.title = c ? `${c.title} · Yoshitha Krishna` : "Yoshitha Krishna";
  const el = SECTIONS.includes(key) ? document.getElementById(key) : null;
  if (el) el.scrollIntoView(); else window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  e.preventDefault();
  b.blur();
  const toast = (msg) => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); };
  const fallback = () => toast(`Couldn't copy. The address is ${b.dataset.copy}`);
  try { navigator.clipboard.writeText(b.dataset.copy).then(() => toast(`Copied ${b.dataset.copy}`), fallback); } catch { fallback(); }
});

/* Keep tape tooltips inside the screen */
const clampTape = (host) => {
  const tp = host.querySelector(":scope > .tape");
  if (!tp) return;
  tp.style.translate = "";
  const r = tp.getBoundingClientRect(), W = document.documentElement.clientWidth;
  const dx = r.right > W - 8 ? W - 8 - r.right : r.left < 8 ? 8 - r.left : 0;
  if (dx) tp.style.translate = dx + "px 0";
};
["pointerover", "focusin"].forEach(ev => document.addEventListener(ev, (e) => {
  const h = e.target.closest && e.target.closest(".tipper, .hv, .photo");
  if (h) clampTape(h);
}));

  const m = THEMES[(i + 1) % THEMES.length][0];

/* Touch screens have no hover: a tap opens a tape note, a tap elsewhere closes it */
document.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse") return;
  const h = e.target.closest(".hv");
  document.querySelectorAll(".hv.open").forEach(x => { if (x !== h) x.classList.remove("open"); });
  if (h) h.classList.toggle("open");
});

/* Touch screens have no hover: tap the portrait to swap it */
document.addEventListener("click", (e) => {
  const p = e.target.closest(".photo");
  if (p && matchMedia("(hover: none)").matches) p.classList.toggle("flip");
});
/* Footer: local time in Bengaluru */
(function tick() {
  const el = document.getElementById("local-time");
  if (el) el.textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kolkata", hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit" }) + " IST";
  setTimeout(tick, 1000);
})();
</script>
